name: flutter_keyboard_visibility
description: Plugin to detect keyboard visibility in Flutter apps.
version: 6.0.0
homepage: https://github.com/MisterJimson/flutter_keyboard_visibility
publish_to: none

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_keyboard_visibility_platform_interface: ^2.0.0
  flutter_keyboard_visibility_web: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pedantic: ^1.11.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.flutter_keyboard_visibility
        pluginClass: FlutterKeyboardVisibilityPlugin
      ios:
        pluginClass: FlutterKeyboardVisibilityPlugin
      web:
        default_package: flutter_keyboard_visibility_web
